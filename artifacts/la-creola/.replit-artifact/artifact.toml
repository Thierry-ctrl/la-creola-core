kind = "web"
previewPath = "/"
title = "La Creola"
version = "1.0.0"
id = "artifacts/la-creola"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23341

[services.development]
run = "pnpm --filter @workspace/la-creola run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/la-creola", "run", "build" ]
publicDir = "artifacts/la-creola/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23341"
BASE_PATH = "/"
