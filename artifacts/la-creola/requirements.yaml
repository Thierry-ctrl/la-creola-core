    description: "Luxury restaurant rooftop overlooking lush green hills at sunset, golden hour light, warm glowing terracotta tones, elegant tables set"
    aspect_ratio: "16:9"
  - path: "artifacts/la-creola/public/images/dish-fusion.png"
    description: "Close-up of elegant Afro-Asian fusion tapas dish on a rustic plate, warm lighting, fine dining presentation"
    aspect_ratio: "4:3"
  - path: "artifacts/la-creola/public/images/cocktail-exotic.png"
    description: "Artisanal tropical cocktail with a flower garnish on a wooden bar, warm moody lighting"
    aspect_ratio: "3:4"
  - path: "artifacts/la-creola/public/images/tapas-spread.png"
    description: "Beautiful spread of various tapas plates, colorful fresh ingredients, golden hour lighting"
    aspect_ratio: "4:3"
  - path: "artifacts/la-creola/public/images/gallery-dining.png"
    description: "Warm luxury restaurant interior, golden hour lighting pouring through windows, terracotta and cream decor"
