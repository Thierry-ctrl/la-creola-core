packages:
  "framer-motion": "For elegant page transitions and scroll-reveals matching the premium brand"
  "react-hook-form": "For robust form state management"
  "@hookform/resolvers": "For zod validation integration with react-hook-form"
  "date-fns": "For date formatting in reservation forms"
  "clsx": "For conditional class names"
  "tailwind-merge": "For merging tailwind classes safely"

images:
